# SonarQube Configuration for Locadora de Videogames API

# Project identification
sonar.projectKey=locadora-videogames
sonar.projectName=Locadora de Videogames
sonar.projectVersion=0.0.1-SNAPSHOT

# Source code
sonar.sources=src/main
sonar.tests=src/test
sonar.sourceEncoding=UTF-8

# Code coverage
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions (DTOs, entities, models typically don't need high coverage)
sonar.exclusions=**/dto/**,**/entity/**,**/model/**

# Analysis configuration
sonar.language=java
sonar.qualitygate.wait=true

# Security-related rules
sonar.security.hotspots.review.priority=HIGH

# Code duplication
sonar.cpd.exclusions=**/dto/**,**/entity/**

# Issue severity thresholds
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S3457
sonar.issue.ignore.multicriteria.e1.resourceKey=**
